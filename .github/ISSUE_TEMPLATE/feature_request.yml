name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe what you want and why it would help. Include version and OS when platform support matters.

  - type: input
    id: version
    attributes:
      label: nullray version
      description: Output of `nullray --version` if you already use a build.
      placeholder: "nullray 0.1.0"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - All platforms
        - Other
    validations:
      required: true

  - type: input
    id: os-details
    attributes:
      label: OS details (if Other)
      placeholder: "CachyOS / Linux 6.x"

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
