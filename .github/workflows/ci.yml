# CI: build, package tests, self-test, CLI smoke.
#
# Harden-Runner first in every job:
#   https://docs.stepsecurity.io/github-actions/harden-runner
#
# Secure-use: least-privilege GITHUB_TOKEN, pinned action SHAs, no
# pull_request_target, concurrency cancel-in-progress.
#
# Pinned actions (bump tag and SHA together):
#   step-security/harden-runner@v2.21.1  e14015d583714f6e62063499dc959a02595150a1
#   actions/checkout@v6.0.1             8e8c483db84b4bee98b60c0593521ed34d9990e8
#   actions/cache@v4.2.3                5a3ec84eff668545956fd18022155c47e93e2684

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: ui
            path: nullray/ui
          - suite: agent
            path: nullray/agent
          - suite: tools
            path: nullray/tools
          - suite: store
            path: nullray/store
          - suite: sandbox
            path: nullray/sandbox
          - suite: mcp
            path: nullray/mcp
          - suite: provider
            path: nullray/provider
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev clang llvm

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-2026-08
          restore-keys: |
            odin-${{ runner.os }}-

      - name: Build Odin
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/odin-lang/Odin.git "$HOME/Odin"
          (cd "$HOME/Odin" && ./build_odin.sh)

      - name: Add Odin to PATH
        run: echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Package tests
        env:
          SUITE_PATH: ${{ matrix.path }}
        run: odin test "$SUITE_PATH" -collection:nullray=nullray -define:ODIN_TEST_THREADS=1

  smoke:
    name: build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev clang llvm

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}-2026-08
          restore-keys: |
            odin-${{ runner.os }}-

      - name: Build Odin
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/odin-lang/Odin.git "$HOME/Odin"
          (cd "$HOME/Odin" && ./build_odin.sh)

      - name: Add Odin to PATH
        run: echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Build nullray
        run: make

      - name: Smoke
        run: |
          ./bin/nullray --self-test
          ./bin/nullray --help | head -5
          ./bin/nullray --version
          ./bin/nullray --completions bash | head -3
          ./bin/nullray --man | head -3
