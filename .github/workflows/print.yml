# Print-mode CI: build and provider-free --print smoke on Linux, macOS, Windows.
#
# Harden-Runner first in every job:
#   https://docs.stepsecurity.io/github-actions/harden-runner
#
# Pinned actions (bump tag and SHA together):
#   step-security/harden-runner@v2.21.1  e14015d583714f6e62063499dc959a02595150a1
#   actions/checkout@v7.0.1             3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/cache@v6.1.0                55cc8345863c7cc4c66a329aec7e433d2d1c52a9

name: print

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  print-linux:
    name: print (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential clang llvm make

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-print-${{ hashFiles('packaging/odin-pin') }}-${{ hashFiles('.github/workflows/print.yml') }}
          restore-keys: |
            odin-${{ runner.os }}-

      - name: Ensure Odin
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-odin.sh
          bash scripts/ensure-odin.sh "$HOME/Odin"
          echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Build
        run: make

      - name: Print smoke
        run: |
          chmod +x scripts/print-smoke.sh
          ./scripts/print-smoke.sh

      - name: Live print (optional)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NULLRAY_PROVIDER: openrouter
          NULLRAY_SANDBOX: "off"
          NULLRAY_STREAM: "0"
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "live print: skip (no OPENROUTER_API_KEY)"
            exit 0
          fi
          out="$(./bin/nullray --print --bare --mode ask --timeout 120 "Reply with exactly: ok")"
          echo "$out" | grep -qi 'ok'
          echo "live print: ok"

  print-macos:
    name: print (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: brew install llvm

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-print-${{ hashFiles('packaging/odin-pin') }}-${{ hashFiles('.github/workflows/print.yml') }}
          restore-keys: |
            odin-${{ runner.os }}-

      - name: Ensure Odin
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-odin.sh
          bash scripts/ensure-odin.sh "$HOME/Odin"
          echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Build
        run: make

      - name: Print smoke
        run: |
          chmod +x scripts/print-smoke.sh
          ./scripts/print-smoke.sh

      - name: Live print (optional)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NULLRAY_PROVIDER: openrouter
          NULLRAY_SANDBOX: "off"
          NULLRAY_STREAM: "0"
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "live print: skip (no OPENROUTER_API_KEY)"
            exit 0
          fi
          out="$(./bin/nullray --print --bare --mode ask --timeout 120 "Reply with exactly: ok")"
          echo "$out" | grep -qi 'ok'
          echo "live print: ok"

  print-windows:
    name: print (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Odin
        id: cache-odin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
          key: odin-windows-print-2026-09-mbedtls1
          restore-keys: |
            odin-windows-release-
            odin-windows-

      - name: Install LLVM
        shell: pwsh
        run: |
          choco install llvm -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Install Odin release
        shell: pwsh
        run: |
          if (Test-Path "$env:USERPROFILE\Odin\odin.exe") {
            Write-Host "using cached odin"
          } else {
            $url = "https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-windows-amd64-dev-2026-09.zip"
            $zip = "$env:RUNNER_TEMP\odin.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Remove-Item -Recurse -Force "$env:USERPROFILE\Odin" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path "$env:USERPROFILE\Odin" | Out-Null
            Expand-Archive -Path $zip -DestinationPath "$env:USERPROFILE\Odin" -Force
            $exe = Get-ChildItem "$env:USERPROFILE\Odin" -Recurse -Filter odin.exe | Select-Object -First 1
            if ($null -eq $exe) { throw "odin.exe not found in release zip" }
            if ($exe.Directory.FullName -ne "$env:USERPROFILE\Odin") {
              Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination "$env:USERPROFILE\Odin" -Recurse -Force
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\Odin"

      - name: Build TLS static lib
        shell: pwsh
        run: .\scripts\build-tls-lib.ps1

      - name: Build
        shell: cmd
        run: |
          where odin
          if not exist bin mkdir bin
          odin build cmd\nullray -out:bin\nullray.exe -collection:nullray=nullray -extra-linker-flags:"-lws2_32" -define:NULLRAY_BUILD_DATE=2026-09-07 -define:NULLRAY_BUILD_TIME=00:00:00

      - name: Print smoke
        shell: pwsh
        run: .\scripts\print-smoke.ps1

      - name: Live print (optional)
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NULLRAY_PROVIDER: openrouter
          NULLRAY_SANDBOX: "off"
          NULLRAY_STREAM: "0"
        run: |
          if (-not $env:OPENROUTER_API_KEY) {
            Write-Host "live print: skip (no OPENROUTER_API_KEY)"
            exit 0
          }
          $out = & .\bin\nullray.exe --print --bare --mode ask --timeout 120 "Reply with exactly: ok"
          if ($LASTEXITCODE -ne 0) { throw "live print failed: $LASTEXITCODE" }
          if ($out -notmatch "(?i)ok") { throw "live print unexpected output: $out" }
          Write-Host "live print: ok"
