# Tag release: build linux/macOS/Windows artifacts, checksums, notes.md, GitHub release.
#
# Harden-Runner first in every job:
#   https://docs.stepsecurity.io/github-actions/harden-runner
#
# Immutable releases are enabled on the repo. Tags matching v*.*.* must not be
# force-moved. Cut a new patch if a release is wrong.
#
# Pinned actions (bump tag and SHA together):
#   step-security/harden-runner@v2.21.1  e14015d583714f6e62063499dc959a02595150a1
#   actions/checkout@v7.0.1             3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/cache@v6.1.0                55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact@v7.0.1      043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8.0.1    3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   softprops/action-gh-release@v3.0.3   e598afbe1493e6b1bafb1f389cabb956eab91231

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild/publish (must already exist)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux_amd64
            archive: tar.gz
          - os: macos-latest
            artifact: darwin_arm64
            archive: tar.gz
          - os: windows-latest
            artifact: windows_amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev clang llvm

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install curl llvm

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install curl -y
          choco install llvm -y

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-${{ hashFiles('.github/workflows/release.yml') }}-2026-09
          restore-keys: |
            odin-${{ runner.os }}-

      - name: Build Odin
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/odin-lang/Odin.git "$HOME/Odin"
          (cd "$HOME/Odin" && ./build_odin.sh)

      - name: Add Odin to PATH
        run: echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Build release binary
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ARTIFACT: ${{ matrix.artifact }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          make clean
          make
          name="nullray_${ver}_${ARTIFACT}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            install -m 755 bin/nullray.exe "dist/${name}.exe" 2>/dev/null || cp bin/nullray "dist/${name}.exe"
            (cd dist && zip "${name}.zip" "${name}.exe")
            rm -f "dist/${name}.exe"
          else
            install -m 755 bin/nullray "dist/${name}"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            rm -f "dist/${name}"
          fi

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nullray-${{ env.RELEASE_TAG }}-*
          path: dist-all
          merge-multiple: true

      - name: Package checksums and notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-all -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          (
            cd dist
            sha256sum ./* > checksums.txt
          )
          bash scripts/release-notes.sh "$TAG" "$REPO" dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: dist/notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
