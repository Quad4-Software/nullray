# Tag release: linux/macOS/Windows archives, AppImage, Flatpak, SBOMs,
# checksums, notes.md, GitHub release.
#
# Harden-Runner first in every job:
#   https://docs.stepsecurity.io/github-actions/harden-runner
#
# Immutable releases are enabled on the repo. Tags matching v*.*.* must not be
# force-moved. Cut a new patch if a release is wrong.
#
# Pinned actions (bump tag and SHA together):
#   step-security/harden-runner@v2.21.1                      e14015d583714f6e62063499dc959a02595150a1
#   actions/checkout@v7.0.1                                 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/cache@v6.1.0                                    55cc8345863c7cc4c66a329aec7e433d2d1c52a9
#   actions/upload-artifact@v7.0.1                          043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
#   actions/download-artifact@v8.0.1                        3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
#   softprops/action-gh-release@v3.0.3                       efb35369e0ad2afab669f228072c1b0d510eae64
#   anchore/sbom-action@v0.24.2                             3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
#   flatpak/flatpak-github-actions/flatpak-builder@v6.8     79327416609af08178ad73b352877e51450790b3

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild/publish (must already exist)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux_amd64
            archive: tar.gz
          - os: ubuntu-24.04-arm
            artifact: linux_arm64
            archive: tar.gz
          - os: macos-latest
            artifact: darwin_arm64
            archive: tar.gz
          - os: windows-latest
            artifact: windows_amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag must match vMAJOR.MINOR.PATCH, got: $TAG"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang llvm make

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Cache Odin toolchain (Unix)
        if: runner.os != 'Windows'
        id: cache-odin-unix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/odin-pin') }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            odin-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Odin (Windows)
        if: runner.os == 'Windows'
        id: cache-odin-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
          key: odin-windows-release-dev-2026-09-mbedtls1
          restore-keys: |
            odin-windows-release-

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"

      - name: Ensure Odin (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-odin.sh
          bash scripts/ensure-odin.sh "$HOME/Odin"
          echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Install Odin release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "$env:USERPROFILE\Odin\odin.exe") {
            Write-Host "using cached odin"
          } else {
            $url = "https://github.com/odin-lang/Odin/releases/download/dev-2026-09/odin-windows-amd64-dev-2026-09.zip"
            $zip = "$env:RUNNER_TEMP\odin.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Remove-Item -Recurse -Force "$env:USERPROFILE\Odin" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path "$env:USERPROFILE\Odin" | Out-Null
            Expand-Archive -Path $zip -DestinationPath "$env:USERPROFILE\Odin" -Force
            $exe = Get-ChildItem "$env:USERPROFILE\Odin" -Recurse -Filter odin.exe | Select-Object -First 1
            if ($null -eq $exe) { throw "odin.exe not found in release zip" }
            if ($exe.Directory.FullName -ne "$env:USERPROFILE\Odin") {
              Copy-Item -Path "$($exe.Directory.FullName)\*" -Destination "$env:USERPROFILE\Odin" -Recurse -Force
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\Odin"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:TAG.TrimStart('v')
          $name = "nullray_${ver}_$($env:ARTIFACT)"
          if (Test-Path bin) { Remove-Item -Recurse -Force bin }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force bin, dist | Out-Null
          where.exe odin
          .\scripts\build-tls-lib.ps1
          odin build cmd\nullray -out:bin\nullray.exe -collection:nullray=nullray -extra-linker-flags:"-lws2_32" "-define:NULLRAY_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" "-define:NULLRAY_BUILD_TIME=$((Get-Date).ToUniversalTime().ToString('HH:mm:ss'))"
          if (-not (Test-Path bin\nullray.exe)) { throw "bin\nullray.exe missing" }
          Copy-Item bin\nullray.exe "dist\${name}.exe"
          Compress-Archive -Path "dist\${name}.exe" -DestinationPath "dist\${name}.zip" -Force
          Remove-Item "dist\${name}.exe"

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        env:
          TAG: ${{ env.RELEASE_TAG }}
          ARTIFACT: ${{ matrix.artifact }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          make clean
          mkdir -p dist bin
          make
          name="nullray_${ver}_${ARTIFACT}"
          cp bin/nullray "dist/${name}"
          chmod 755 "dist/${name}"
          # Keep unpacked binary for Linux amd64 packaging jobs (AppImage/Flatpak).
          if [[ "$ARTIFACT" == "linux_amd64" ]]; then
            cp "dist/${name}" dist/nullray
          fi
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -f "dist/${name}"

      - name: Smoke binary (Unix)
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          tar -xzf "dist/nullray_${ver}_${ARTIFACT}.tar.gz" -C /tmp
          "/tmp/nullray_${ver}_${ARTIFACT}" --version
          "/tmp/nullray_${ver}_${ARTIFACT}" --self-test

      - name: Smoke binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          Expand-Archive -Path "dist/nullray_${ver}_$($env:ARTIFACT).zip" -DestinationPath "$env:RUNNER_TEMP\nullray-smoke" -Force
          & "$env:RUNNER_TEMP\nullray-smoke\nullray_${ver}_$($env:ARTIFACT).exe" --version
          & "$env:RUNNER_TEMP\nullray-smoke\nullray_${ver}_$($env:ARTIFACT).exe" --self-test

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-linux_amd64
          path: dist-linux

      - name: Install AppImage deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file librsvg2-bin libfuse2t64 ca-certificates
          sudo apt-get install -y --no-install-recommends fuse3 || true

      - name: Build AppImage
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          export VERSION="$ver"
          chmod +x scripts/build-appimage.sh
          mkdir -p dist
          bash scripts/build-appimage.sh dist-linux/nullray dist

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  appimage-sdk:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-linux_amd64
          path: dist-linux

      - name: Install SDK pack deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl file librsvg2-bin libfuse2t64 ca-certificates \
            clang llvm git make python3
          sudo apt-get install -y --no-install-recommends fuse3 || true

      - name: Cache Odin toolchain
        id: cache-odin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Odin
            ~/.cache/odin
          key: odin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/odin-pin') }}-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            odin-${{ runner.os }}-${{ runner.arch }}-

      - name: Ensure Odin
        run: |
          set -euo pipefail
          chmod +x scripts/ensure-odin.sh
          bash scripts/ensure-odin.sh "$HOME/Odin"
          echo "$HOME/Odin" >> "$GITHUB_PATH"

      - name: Build SDK AppImage
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          export VERSION="$ver"
          export NULLRAY_ODIN_ROOT="$HOME/Odin"
          chmod +x scripts/build-appimage-sdk.sh scripts/appimage-tools.sh scripts/fetch-appimage-tools.sh
          mkdir -p dist
          bash scripts/build-appimage-sdk.sh dist-linux/nullray dist

      - name: Upload SDK AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-appimage-sdk
          path: dist/nullray-sdk_*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-linux_amd64
          path: dist-linux

      - name: Stage Flatpak sources
        run: |
          set -euo pipefail
          install -m 755 dist-linux/nullray packaging/flatpak/nullray
          install -m 644 logo/nullray-icon.svg packaging/flatpak/nullray.svg

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: nullray.flatpak
          manifest-path: packaging/flatpak/xyz.nullray.code.yml
          cache-key: flatpak-${{ github.sha }}
          upload-artifact: false
          arch: x86_64

      - name: Rename bundle
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          mv nullray.flatpak "dist/nullray_${ver}_linux_amd64.flatpak"

      - name: Upload Flatpak
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nullray-${{ env.RELEASE_TAG }}-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build, appimage, appimage-sdk, flatpak]
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nullray-${{ env.RELEASE_TAG }}-*
          path: dist-all
          merge-multiple: true

      - name: Collect release files
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          mkdir -p dist
          find dist-all -type f \( \
            -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.flatpak' \
          \) -exec cp -v {} dist/ \;
          # Drop unpackaged linux helper binary from archive job if present.
          rm -f dist/nullray

      - name: SBOM archives (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: cyclonedx-json
          artifact-name: nullray-${{ env.RELEASE_TAG }}.cdx.json
          output-file: dist/nullray-${{ env.RELEASE_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM archives (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          artifact-name: nullray-${{ env.RELEASE_TAG }}.spdx.json
          output-file: dist/nullray-${{ env.RELEASE_TAG }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Per-binary SBOMs
        run: |
          set -euo pipefail
          SYFT_VER=1.51.1
          SYFT_TGZ="syft_${SYFT_VER}_linux_amd64.tar.gz"
          SYFT_SHA256=8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
          curl -fsSL -o "/tmp/${SYFT_TGZ}" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VER}/${SYFT_TGZ}"
          echo "${SYFT_SHA256}  /tmp/${SYFT_TGZ}" | sha256sum -c -
          tar -C /tmp -xzf "/tmp/${SYFT_TGZ}" syft
          chmod +x /tmp/syft
          for f in dist/*.tar.gz dist/*.zip dist/*.AppImage dist/*.flatpak; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            stem="${base%.tar.gz}"
            stem="${stem%.zip}"
            stem="${stem%.AppImage}"
            stem="${stem%.flatpak}"
            /tmp/syft scan "file:${f}" \
              -o "cyclonedx-json=dist/${stem}.cdx.json" \
              -o "spdx-json=dist/${stem}.spdx.json"
          done

      - name: Package checksums and notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum ./* > checksums.txt
          )
          bash scripts/release-notes.sh "$TAG" "$REPO" dist/notes.md dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: dist/notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.flatpak
            dist/*.cdx.json
            dist/*.spdx.json
            dist/checksums.txt
            dist/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
