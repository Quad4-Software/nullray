# Dependency review on pull requests.
#
# Harden-Runner first in every job:
#   https://docs.stepsecurity.io/github-actions/harden-runner
#
# Pinned actions (bump tag and SHA together):
#   step-security/harden-runner@v2.21.1           e14015d583714f6e62063499dc959a02595150a1
#   actions/checkout@v7.0.1                      3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/dependency-review-action@v5.0.0      a1d282b36b6f3519aa1f3fc636f609c47dddb294

name: dependency-review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
